<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#12666b">
<title>我的台股監控</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f3f7f8;color:#173b4b;font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Noto Sans TC",sans-serif}
.header{background:linear-gradient(145deg,#12666b,#174c63);color:#fff;padding:calc(18px + env(safe-area-inset-top)) 18px 18px;position:sticky;top:0;z-index:5}
.header h1{font-size:24px;margin:0 0 4px}.header p{margin:0;opacity:.82;font-size:13px}
.nav{display:flex;gap:8px;padding:12px;background:#fff;position:sticky;top:91px;z-index:4;overflow:auto;border-bottom:1px solid #e2eaec}
.nav button{white-space:nowrap;border:0;border-radius:20px;padding:9px 14px;background:#edf3f4;color:#35606b;font-weight:700}.nav button.active{background:#12666b;color:#fff}
main{padding:14px;max-width:760px;margin:auto}.cards{display:grid;grid-template-columns:1fr 1fr;gap:10px}.card{background:#fff;border-radius:16px;padding:14px;box-shadow:0 2px 10px #153b4b12}.card.big{grid-column:span 2}.label{font-size:12px;color:#71838a}.num{font-size:22px;font-weight:800;margin-top:4px}.up{color:#d84d45}.down{color:#14966c}.section{margin-top:14px}.section h2{font-size:18px;margin:0 0 10px}
.stock{background:#fff;border-radius:15px;padding:13px 14px;margin:8px 0;box-shadow:0 2px 8px #153b4b0d}.top{display:flex;justify-content:space-between;align-items:center}.name{font-weight:800}.code{font-size:12px;color:#78909a;margin-left:6px}.price{font-size:20px;font-weight:800}.meta{display:flex;gap:12px;flex-wrap:wrap;margin-top:7px;font-size:12px;color:#6c8088}.pill{background:#edf3f4;padding:4px 7px;border-radius:8px}
.toolbar{display:flex;gap:8px}.toolbar input{flex:1;min-width:0;border:1px solid #cbdadd;border-radius:10px;padding:11px}.toolbar button{border:0;background:#12666b;color:#fff;border-radius:10px;padding:0 14px;font-weight:700}
.note{background:#fff8e8;border-radius:13px;padding:12px;font-size:13px;line-height:1.6;color:#705b30;margin-top:12px}
.footer{height:30px}
.small-btn{float:right;border:0;background:#12666b;color:#fff;border-radius:9px;padding:7px 10px;font-weight:700}
.remove-btn{border:0;background:#edf3f4;color:#35606b;border-radius:8px;padding:5px 9px}
.modal{position:fixed;inset:0;background:#0005;display:flex;align-items:center;justify-content:center;z-index:20}
.modal-box{width:min(92vw,390px);background:#fff;border-radius:16px;padding:18px}
.modal-box h3{margin:0 0 12px}.modal-box label{display:block;font-size:13px;margin:9px 0 5px}.modal-box input,.modal-box select{width:100%;padding:10px;border:1px solid #cbdadd;border-radius:10px}.modal-actions{display:flex;gap:8px;margin-top:14px}.modal-actions button{flex:1;padding:10px;border:0;border-radius:10px;font-weight:700}
@media(max-width:390px){main{padding:10px}.cards{gap:7px}.card{padding:12px}.num{font-size:19px}.nav{top:89px}}
</style>
</head>
<body>
<header class="header"><h1>📈 我的台股監控</h1><p>持股、觀察、當沖分開管理｜鴻友不列入</p></header>
<div class="nav">
<button class="active" onclick="tab('hold',this)">📦 我的持股</button>
<button onclick="tab('watch',this)">👀 觀察</button>
<button onclick="tab('day',this)">⚡ 當沖</button>
</div>
<main>
<div id="hold">
<div class="cards">
<div class="card"><div class="label">截圖基準總市值</div><div class="num">149,130</div></div>
<div class="card"><div class="label">截圖基準總成本</div><div class="num">115,012</div></div>
<div class="card big"><div class="label">截圖基準總損益</div><div class="num up">+33,685　(+29.29%)</div></div>
</div>
<div class="section"><h2>目前持股 <button class="small-btn" onclick="openTrade()">＋新增交易</button></h2><div id="stocks"></div></div>
<div class="note">行情已連接 Fugle｜每 30 秒自動更新一次。價格、市值、持股損益會隨行情更新。</div>
</div>

<div id="watch" style="display:none">
<div class="section"><h2>👀 觀察清單</h2><div class="toolbar"><input id="wcode" placeholder="股票代號，例如 2330"><button onclick="add('watch')">加入</button></div><div id="watchlist"></div></div>
</div>

<div id="day" style="display:none">
<div class="section"><h2>⚡ 今日當沖觀察</h2><div class="toolbar"><input id="dcode" placeholder="股票代號，例如 2330"><button onclick="add('day')">加入</button></div><div id="daylist"></div></div>
<div class="note">當沖模式與長期持股分開。行情會自動更新。</div>
</div>
<div class="footer"></div>
</main>
<div id="tradeModal" class="modal" style="display:none">
  <div class="modal-box">
    <h3>新增交易</h3>
    <label>股票代號</label><input id="tradeSymbol" inputmode="numeric" placeholder="例如 0050">
    <label>動作</label><select id="tradeSide"><option value="buy">買進</option><option value="sell">賣出</option></select>
    <label>股數</label><input id="tradeShares" type="number" min="1" inputmode="numeric" placeholder="例如 100">
    <label>實際成交價</label><input id="tradePrice" type="number" min="0" step="0.01" inputmode="decimal" placeholder="例如 108">
    <div class="modal-actions"><button onclick="saveTrade()">儲存</button><button onclick="closeTrade()">取消</button></div>
  </div>
</div>
<script>
const API_BASE="https://calm-wind-e623.chaioochen.workers.dev";
const REFRESH_MS=30000;
const API_URL=(symbols)=>API_BASE+'/?symbols='+encodeURIComponent(symbols.join(','))+'&_='+Date.now();

const DEFAULT_STOCKS=[
["0050","元大台灣50",900,74.15],["00935","野村臺灣新科技50",10,56.89],
["2344","華邦電",20,187.53],["2383","台光電",3,5459.5],
["2408","南亞科",4,532.86],["2454","聯發科",2,3932.5],
["3042","晶技",20,183.87],["3189","景碩",2,824.65],
["3374","精材",10,318.51],["4916","事欣科",1,100.15],
["4979","華星光",5,622.56],["5351","鈺創",36,118.47],
["6488","環球晶",2,990.89]
];
let stocks=JSON.parse(localStorage.getItem('myholdings')||'null')||DEFAULT_STOCKS;
let quotes={};
let watch=JSON.parse(localStorage.getItem('mywatch')||'[]');
let day=JSON.parse(localStorage.getItem('myday')||'[]');

function money(n){return Number.isFinite(n)?n.toLocaleString('zh-TW',{maximumFractionDigits:2}):'—'}
function signed(n){return `${n>=0?'+':''}${money(n)}`}
function renderHold(){
  const rows=stocks.map(s=>{
    const q=quotes[s[0]]||{};
    const hasLive=Number.isFinite(q.price);
    const price=hasLive?q.price:null;
    const pnl=hasLive?(price-s[3])*s[2]:null;
    return `<div class="stock">
      <div class="top"><div><span class="name">${s[1]}</span><span class="code">${s[0]}</span></div>
      <div class="price">${hasLive?money(price):'—'}</div></div>
      <div class="meta"><span class="pill">${s[2]} 股</span>
      <span>市值 ${hasLive?money(s[2]*price):'—'}</span>
      <span class="${hasLive?(pnl>=0?'up':'down'):''}">損益 ${hasLive?signed(pnl):'—'}</span>
      ${q.previousClose!=null?`<span>昨收 ${money(q.previousClose)}</span>`:''}</div>
    </div>`
  }).join('');
  document.getElementById('stocks').innerHTML=rows;

  const totalValue=stocks.reduce((a,s)=>{
    const p=Number.isFinite(quotes[s[0]]?.price)?quotes[s[0]].price:null;
    return a+(p==null?0:s[2]*p);
  },0);
  const totalCost=stocks.reduce((a,s)=>a+s[2]*s[3],0);
  const liveCount=stocks.filter(s=>Number.isFinite(quotes[s[0]]?.price)).length;
  const totalPnl=totalValue-totalCost;
  document.querySelector('#hold .card:nth-child(1) .num').textContent=money(totalValue);
  document.querySelector('#hold .card:nth-child(2) .num').textContent=money(totalCost);
  const totalEl=document.querySelector('#hold .card.big .num');
  if(liveCount===stocks.length){
    totalEl.textContent=`${signed(totalPnl)}　(${totalCost?((totalPnl/totalCost)*100).toFixed(2):'0.00'}%)`;
    totalEl.className=`num ${totalPnl>=0?'up':'down'}`;
  }else{
    totalEl.textContent='—';
    totalEl.className='num';
  }
}

function renderList(type){
  const arr=type==='watch'?watch:day;
  const el=document.getElementById(type==='watch'?'watchlist':'daylist');
  el.innerHTML=arr.length?arr.map((x,i)=>{
    const q=quotes[x]||{};
    const label=q.name?`${q.name} <span class="code">${x}</span>`:x;
    return `<div class="stock"><div class="top"><div><b>${label}</b></div>
      <div class="price">${q.price!=null?money(q.price):'—'}</div></div>
      <div class="meta">
      ${q.previousClose!=null?`<span>昨收 ${money(q.previousClose)}</span>`:''}
      ${q.previousClose!=null&&q.price!=null?`<span class="${q.price>=q.previousClose?'up':'down'}">${q.price>=q.previousClose?'+':''}${money(q.price-q.previousClose)}</span>`:''}
      <button onclick="removeItem('${type}',${i})">移除</button>
      </div></div>`;
  }).join(''):(type==='watch'?'<p class="label">目前沒有觀察股。</p>':'<p class="label">今天尚未加入當沖觀察股。</p>');
}

function openTrade(){document.getElementById('tradeModal').style.display='flex'}
function closeTrade(){document.getElementById('tradeModal').style.display='none'}
function saveTrade(){
  const symbol=document.getElementById('tradeSymbol').value.trim();
  const side=document.getElementById('tradeSide').value;
  const shares=Number(document.getElementById('tradeShares').value);
  const price=Number(document.getElementById('tradePrice').value);
  if(!/^\d{4,6}$/.test(symbol)||shares<=0||price<=0){alert('請輸入正確的股票代號、股數與成交價');return}
  const i=stocks.findIndex(x=>x[0]===symbol);
  if(i<0){
    if(side==='sell'){alert('目前沒有這檔持股，無法賣出');return}
    stocks.push([symbol,symbol,shares,price]);
  }else{
    const h=stocks[i];
    if(side==='buy'){
      h[3]=(h[2]*h[3]+shares*price)/(h[2]+shares); h[2]+=shares;
    }else{
      if(shares>h[2]){alert('賣出股數不能超過目前持股');return}
      h[2]-=shares; if(h[2]===0)stocks.splice(i,1);
    }
  }
  localStorage.setItem('myholdings',JSON.stringify(stocks));
  closeTrade(); render(); loadQuotes();
}
function render(){renderHold();renderList('watch');renderList('day')}

async function loadQuotes(){
  const symbols=[...new Set([...stocks.map(s=>s[0]),...watch,...day])]
    .filter(x=>/^\d{4,6}$/.test(x)).slice(0,30);
  if(!symbols.length)return;
  try{
    const r=await fetch(API_URL(symbols),{method:'GET',cache:'no-store'});
    if(!r.ok)throw new Error('Worker '+r.status);
    const data=await r.json();
    if(!data || data.success!==true || !Array.isArray(data.quotes)) throw new Error('報價資料格式錯誤');
    data.quotes.forEach(q=>{if(q.symbol && !q.error && q.price!=null) quotes[String(q.symbol)]=q});
    render();
    document.querySelector('.header p').textContent=`自動更新中｜每 30 秒更新一次｜最後更新 ${new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit',second:'2-digit'})}`;
  }catch(e){
    console.error('報價更新失敗',e);
    document.querySelector('.header p').textContent='目前無法取得即時行情，請稍後再試';
  }
}

function tab(id,btn){
  ['hold','watch','day'].forEach(x=>document.getElementById(x).style.display=x===id?'block':'none');
  document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active')
}
function add(type){
  const id=type==='watch'?'wcode':'dcode';
  const v=document.getElementById(id).value.trim();
  if(!/^\d{4,6}$/.test(v))return;
  const arr=type==='watch'?watch:day;
  if(!arr.includes(v))arr.push(v);
  localStorage.setItem(type==='watch'?'mywatch':'myday',JSON.stringify(arr));
  document.getElementById(id).value='';
  render();loadQuotes();
}
function removeItem(type,i){
  const arr=type==='watch'?watch:day;
  arr.splice(i,1);
  localStorage.setItem(type==='watch'?'mywatch':'myday',JSON.stringify(arr));
  render();loadQuotes();
}
render();
loadQuotes();
setInterval(loadQuotes,REFRESH_MS);
</script>
</body></html>
